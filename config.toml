# Site settings
baseURL = "https://blissful-golick-fb1bb0.netlify.com/"
languageCode = "en-US"
title = "Danny J. Liu | Enterprise Delivery Automation & AI Architect"
theme = "hugo-split-theme"
disableKinds = ["section", "taxonomy", "taxonomyTerm", "RSS", "sitemap"]

# Enter your tracking code to enable Google Analytics
googleAnalytics = ""

# Copyright
copyright = "&copy;2019"

[params]

  # Metadata for search engines and social sharing
  author = "Danny J. Liu"
  description = "Danny Liu is an enterprise delivery automation and AI architect, podcast host, and Udemy instructor with 15+ years in agile and 20+ years in IT."
  shareImage = "images/social.jpg"
  twitterHandle = "dannyjliu"

  # Favicon
  favicon = "favicon.ico"

  # Section - Visual
  [params.visual]

    # Image
    [params.visual.image]
      enable = true
      file = "images/background.jpg"
      position = "none"

    # Video
    [params.visual.video]
      enable = false
      mute = true
      file = "videos/background.mp4"
      # youtubeId = "dk9uNWPP7EA"

  # Links
  #
